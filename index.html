<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single File Platformer</title>
    <style>
        /* --- CSS STYLES --- */
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        p { margin-top: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Controls: Arrow Keys to Move, Space to Jump</p>

    <script>
        // --- JAVASCRIPT GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Physics Constants
        const gravity = 0.5;
        const friction = 0.8;

        // Player Object
        const player = {
            x: 50,
            y: 200,
            width: 30,
            height: 30,
            speed: 5,
            dx: 0,
            dy: 0,
            jumpStrength: 12,
            grounded: false,
            color: '#e74c3c'
        };

        // Platforms
        const platforms = [
            { x: 0, y: 350, width: 800, height: 50 },    // Floor
            { x: 200, y: 250, width: 100, height: 20 },
            { x: 450, y: 180, width: 100, height: 20 },
            { x: 650, y: 120, width: 80, height: 20 },
            { x: 50, y: 150, width: 50, height: 20 }
        ];

        // Input Handling
        const keys = { right: false, left: false, up: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.up = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.up = false;
        });

        // Main Game Logic
        function update() {
            // Horizontal Movement
            if (keys.right) player.dx = player.speed;
            else if (keys.left) player.dx = -player.speed;
            else player.dx *= friction;

            player.x += player.dx;

            // Jumping & Gravity
            if (keys.up && player.grounded) {
                player.dy = -player.jumpStrength;
                player.grounded = false;
            }

            player.dy += gravity;
            player.y += player.dy;

            // Collision Detection
            player.grounded = false;
            platforms.forEach(platform => {
                if (
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y < platform.y + platform.height &&
                    player.y + player.height > platform.y
                ) {
                    // Check if falling down onto the platform
                    if (player.dy > 0 && player.y + player.height - player.dy <= platform.y) {
                        player.grounded = true;
                        player.dy = 0;
                        player.y = platform.y - player.height;
                    }
                }
            });

            // Boundary Checks
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            
            // Respawn if fallen
            if (player.y > canvas.height) {
                player.x = 50;
                player.y = 200;
                player.dy = 0;
            }
        }

        // Render Function
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#27ae60';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
